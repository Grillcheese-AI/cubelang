[package]
name = "cubelang"
version = "0.1.0"
edition = "2021"
description = "CubeLang — Unified AI Instruction Language. Compiles to CubeMind VM bytecodes."
license = "BUSL-1.1"   # Business Source License 1.1 -- see LICENSE (Change Date 2030-09-11 -> Apache-2.0)
authors = ["Grillcheese Research Laboratory <info@grillcheeseai.com>"]
keywords = ["ai", "language", "bytecode", "vm", "cubemind"]
categories = ["compilers", "science"]

[dependencies]
blake3 = "1"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
prost = "0.13"
# Identity, signatures and key files (2026-10-24), on the CNSA 2.0 suite; see src/auth.rs.
#   ML-DSA-87 (FIPS 204): Cryspen's libcrux, formally verified arithmetic (hax + F*), Apache-2.0,
#   pinned exactly (0.0.x). Ed25519: dalek, BSD-3. Both signatures must verify.
#   SHA-384 / HKDF-SHA-384, Argon2id + AES-256-GCM for key files at rest: RustCrypto, MIT/Apache-2.0.
libcrux-ml-dsa = "=0.0.11"
ed25519-dalek = "2"
sha2 = "0.11"
hkdf = "0.13"
argon2 = "0.6"
aes-gcm = "0.11"
zeroize = "1"
# Sealed content (2026-10-24, src/seal.rs): a hybrid KEM, ML-KEM-1024 (FIPS 203; Cryspen's libcrux,
# the same formally verified family and release as the ML-DSA above) AND X25519 (dalek, on the same
# curve library as Ed25519); AES-256-GCM over a key derived from both.
libcrux-ml-kem = "=0.0.11"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# The layered store (2026-10-24, src/vm/segment.rs): immutable sorted segments as finite-state
# transducers (BurntSushi's fst, MIT/Unlicense), with its Levenshtein automata for typo-tolerant
# history search.
fst = { version = "0.4", features = ["levenshtein"] }
# TLS 1.3 for a remote run-proto (2026-10-24, src/tls.rs): rustls (Apache-2.0/MIT/ISC) on AWS-LC
# (aws-lc-rs, Apache-2.0/ISC: the provider with the post-quantum hybrid key exchanges, and a FIPS
# 140-3 validated module when built with its `fips` feature). `prebuilt-nasm`: Windows builds need
# no NASM install.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }

[dev-dependencies]

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3.2.0"
