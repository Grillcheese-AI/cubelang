[package]
name = "wdstore"
version = "0.1.0"
edition = "2021"
description = "Cubby's hot Wikidata store (order 0055): exact statements, two clocks, redirects; built from the dump"
license = "BUSL-1.1"   # as the cubelang repository it lives in (LICENSE at the root)
authors = ["Grillcheese Research Laboratory <info@grillcheeseai.com>"]
publish = false

# Its own workspace and target folder: building it never touches cubelang's target/release.
[workspace]

[dependencies]
# Each licence checked (order 0055: "every crate's licence checked"):
blake3 = "1"     # CC0-1.0 / Apache-2.0: chunk hashes, the deterministic-rebuild check
flate2 = "1"     # MIT / Apache-2.0: the dump's sample segments are gzip
fst = { version = "0.4", features = ["levenshtein"] }   # MIT / Unlicense: the name index (as cubelang's own store)
bzip2 = "0.5"                                          # MIT / Apache-2.0: one bzip2 block at a time, on every core
memchr = "2"
mimalloc = { version = "0.1", default-features = false }   # MIT: the allocator (Windows' heap serialized ingest's threads)
serde_json = "1"                                       # MIT / Apache-2.0: `serve`'s requests and answers
memmap2 = "0.9"                                        # MIT / Apache-2.0: the store read in place, from the SSD                                           # MIT / Unlicense: finding the blocks' start markers
unicode-normalization = "0.1"                          # MIT / Apache-2.0: accent-folded name keys

[profile.release]
debug = false
