[package]
name = "cubelang"
version = "0.1.0"
edition = "2021"
description = "CubeLang — Unified AI Instruction Language. Compiles to CubeMind VM bytecodes."
license = "MIT"
authors = ["Grillcheese Research Laboratory <info@grillcheeseai.com>"]
keywords = ["ai", "language", "bytecode", "vm", "cubemind"]
categories = ["compilers", "science"]

[dependencies]
blake3 = "1"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

[dev-dependencies]
