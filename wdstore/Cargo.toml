[package]
name = "wdstore"
version = "0.1.0"
edition = "2021"
description = "Cubby's hot Wikidata store (order 0055): exact statements, two clocks, redirects; built from the dump"
license = "BUSL-1.1"   # as the cubelang repository it lives in (LICENSE at the root)
authors = ["Grillcheese Research Laboratory <info@grillcheeseai.com>"]
publish = false

# Its own workspace and target folder: building it never touches cubelang's target/release.
[workspace]

[dependencies]
# Each licence checked (order 0055: "every crate's licence checked"):
blake3 = "1"     # CC0-1.0 / Apache-2.0: chunk hashes, the deterministic-rebuild check
flate2 = "1"     # MIT / Apache-2.0: the dump's sample segments are gzip

[profile.release]
debug = false
